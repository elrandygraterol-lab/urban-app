name: iOS Production Build (App Store)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (CFBundleVersion). Debe ser nuevo y mayor a los ya subidos a App Store Connect para la version 1.0.0.'
        required: false
        default: ''

jobs:
  build:
    name: Build and Upload iOS App to App Store
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      NODE_VERSION: '20'
      IOS_PROJECT_PATH: 'ios'
      EAS_BUILD_PROFILE: 'production'
      BUNDLE_ID: 'com.urbantaxi.app'
      TEAM_ID: 'FG4FGTT4Z4'
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: 'keychain-pass-urbantax-2024'
      CERT_IDENTITY: 'iPhone Distribution: Maria velazquez motta (FG4FGTT4Z4)'
      EXPO_PUBLIC_API_URL: 'https://administracionurbantaxis.com'
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: 'AIzaSyDu-vsndSIMluuvLfmGf_sAhQiNDliznrU'
      EXPO_NO_DOTENV: '1'
      MARKETING_VERSION: '1.0.0'
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli eas-cli

      - name: Decode GoogleService-Info.plist (production)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          node -e "require('fs').writeFileSync('GoogleService-Info.plist', Buffer.from(process.env.GOOGLE_SERVICE_INFO_PLIST_BASE64, 'base64'))"
          ls -la GoogleService-Info.plist

      - name: Prebuild iOS project (production profile)
        run: |
          npx expo prebuild --clean --platform ios

      - name: Detect generated Xcode project name
        run: |
          set -euo pipefail
          XCODEPROJ_DIR="$(find ${{ env.IOS_PROJECT_PATH }} -maxdepth 1 -name '*.xcodeproj' | head -1)"
          if [ -z "$XCODEPROJ_DIR" ]; then
            echo "ERROR: no se encontro ningun .xcodeproj tras el prebuild."
            ls -la ${{ env.IOS_PROJECT_PATH }} || true
            exit 1
          fi
          IOS_PROJECT_NAME="$(basename "$XCODEPROJ_DIR" .xcodeproj)"
          echo "IOS_PROJECT_NAME=$IOS_PROJECT_NAME" >> "$GITHUB_ENV"
          echo "Detected project: $IOS_PROJECT_NAME"
          echo "SCHEME=$IOS_PROJECT_NAME" >> "$GITHUB_ENV"
          ls -la ${{ env.IOS_PROJECT_PATH }}

      - name: Patch '@import' in Google-Maps-iOS-Utils headers
        run: |
          set -euo pipefail
          replaced=0
          for f in $(grep -rIl "@import" ${{ env.IOS_PROJECT_PATH }}/Pods/Google-Maps-iOS-Utils/Sources 2>/dev/null || true); do
            sed -i '' 's/@import \([A-Za-z0-9_]*\);/#import <\1\/\1.h>/' "$f"
            replaced=$((replaced+1))
          done
          for f in $(grep -rIl "@import" ${{ env.IOS_PROJECT_PATH }}/Pods/GoogleMaps/Maps/Sources 2>/dev/null || true); do
            sed -i '' 's/@import \([A-Za-z0-9_]*\);/#import <\1\/\1.h>/' "$f"
            replaced=$((replaced+1))
          done
          echo "Patched $replaced files"
          grep -rn "@import" ${{ env.IOS_PROJECT_PATH }}/Pods/Google-Maps-iOS-Utils/Sources 2>/dev/null || echo "No '@import' remaining in Google-Maps-iOS-Utils"

      - name: Create certs directory
        run: |
          mkdir -p ${{ env.IOS_PROJECT_PATH }}/certs
          ls -la ${{ env.IOS_PROJECT_PATH }}/certs/

      - name: Decode and install P12 certificate (Distribution for App Store)
        env:
          APPSTORE_P12_BASE64: ${{ secrets.APPSTORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "APPSTORE_P12_BASE64 length (raw): ${#APPSTORE_P12_BASE64}"
          node -e "
            const raw = process.env.APPSTORE_P12_BASE64.replace(/\s+/g, '');
            const buf = Buffer.from(raw, 'base64');
            const fs = require('fs');
            fs.writeFileSync('${{ env.IOS_PROJECT_PATH }}/certs/dist-cert.p12', buf);
            console.log('APPSTORE_P12_BASE64 length (sanitized):', raw.length, '(expected 4476)');
            console.log('Decoded bytes:', buf.length, '(expected 3356)');
            if (buf.length !== 3356) {
              console.error('ERROR: P12 distribucion decodificado corrupto (longitud != 3356).');
              console.error('  Regenere con: base64 -i ios/certs/dist-cert.p12 | tr -d newline');
              process.exit(1);
            }
          "
          echo "--- Validacion openssl del P12 decodificado ---"
          if openssl pkcs12 -in ${{ env.IOS_PROJECT_PATH }}/certs/dist-cert.p12 -passin pass:"${P12_PASSWORD}" -nokeys -noout 2> /tmp/openssl_err.txt; then
            echo "OK: P12 abierto con P12_PASSWORD (MAC valida)"
            echo "--- Identidad del certificado ---"
            openssl pkcs12 -in ${{ env.IOS_PROJECT_PATH }}/certs/dist-cert.p12 -passin pass:"${P12_PASSWORD}" -clcerts -nokeys 2>/dev/null | openssl x509 -noout -subject
          else
            echo "FALLO: no se puede abrir el P12 con la P12_PASSWORD del secret."
            cat /tmp/openssl_err.txt
            exit 1
          fi
          echo "--- Normalizacion del P12 con algoritmos compatibles macOS (SHA1/3DES) ---"
          openssl pkcs12 -in ${{ env.IOS_PROJECT_PATH }}/certs/dist-cert.p12 \
            -passin pass:"${P12_PASSWORD}" -nodes -out /tmp/dist_extracted.pem
          openssl pkcs12 -export -in /tmp/dist_extracted.pem \
            -passout pass:"${P12_PASSWORD}" \
            -name "${{ env.CERT_IDENTITY }}" \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -out ${{ env.IOS_PROJECT_PATH }}/certs/dist_cert_normalized.p12
          openssl pkcs12 -in ${{ env.IOS_PROJECT_PATH }}/certs/dist_cert_normalized.p12 \
            -passin pass:"${P12_PASSWORD}" -nokeys -noout
          echo "OK: P12 distribucion normalizado generado (MAC SHA1 + 3DES)"
          ls -la ${{ env.IOS_PROJECT_PATH }}/certs/

      - name: Decode and install Provisioning Profile (App Store)
        env:
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "APPSTORE_PROFILE_BASE64 length: ${#APPSTORE_PROFILE_BASE64}"
          node -e "
            const raw = process.env.APPSTORE_PROFILE_BASE64.replace(/\s+/g, '');
            const buf = Buffer.from(raw, 'base64');
            const fs = require('fs');
            fs.writeFileSync('${{ env.IOS_PROJECT_PATH }}/certs/profile-appstore.mobileprovision', buf);
            console.log('APPSTORE_PROFILE_BASE64 length (sanitized):', raw.length);
            console.log('Decoded bytes:', buf.length);
            if (buf.length < 1000) {
              console.error('ERROR: Provisioning profile App Store decodificado corrupto (muy corto).');
              process.exit(1);
            }
          "
          file ${{ env.IOS_PROJECT_PATH }}/certs/profile-appstore.mobileprovision
          echo "--- Perfil: datos del mobileprovision ---"
          PROFILE_NAME="$(security cms -D -i ${{ env.IOS_PROJECT_PATH }}/certs/profile-appstore.mobileprovision 2>/dev/null | plutil -extract Name raw -)"
          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: no se pudo extraer el Name del perfil App Store."
            exit 1
          fi
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Nombre del perfil: $PROFILE_NAME"
          security cms -D -i ${{ env.IOS_PROJECT_PATH }}/certs/profile-appstore.mobileprovision 2>/dev/null | grep -E "<key>(AppIDName|TeamName)" -A1 | head -4 || true

      - name: Configure manual code signing on app target
        run: |
          node -e "
            const fs = require('fs');
            const p = '${{ env.IOS_PROJECT_PATH }}/${{ env.IOS_PROJECT_NAME }}.xcodeproj/project.pbxproj';
            let s = fs.readFileSync(p, 'utf8');
            const anchor = '\t\t\t\tDEVELOPMENT_TEAM = ${{ env.TEAM_ID }};';
            const inject = anchor + '\n' +
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n' +
              '\t\t\t\tCODE_SIGN_IDENTITY = \"iPhone Distribution\";\n' +
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"' + process.env.PROFILE_NAME + '\";';
            const count = (s.split(anchor).length - 1);
            if (count < 2) {
              console.error('ERROR: esperaba al menos 2 ocurrencias de DEVELOPMENT_TEAM en el app target, encontradas:', count);
              process.exit(1);
            }
            s = s.split(anchor).join(inject);
            fs.writeFileSync(p, s);
            console.log('OK: firma manual (iPhone Distribution / App Store) inyectada en', count, 'build configs del app target (' + process.env.PROFILE_NAME + ')');
          "
          grep -n "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_IDENTITY" ${{ env.IOS_PROJECT_PATH }}/${{ env.IOS_PROJECT_NAME }}.xcodeproj/project.pbxproj || true

      - name: Set build number (CURRENT_PROJECT_VERSION)
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Usando build number: $BUILD_NUMBER"
          node -e "
            const fs = require('fs');
            const p = '${{ env.IOS_PROJECT_PATH }}/${{ env.IOS_PROJECT_NAME }}.xcodeproj/project.pbxproj';
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(/CURRENT_PROJECT_VERSION = [^;]*;/g, 'CURRENT_PROJECT_VERSION = ' + process.env.BUILD_NUMBER + ';');
            s = s.replace(/MARKETING_VERSION = [^;]*;/g, 'MARKETING_VERSION = ' + process.env.MARKETING_VERSION + ';');
            fs.writeFileSync(p, s);
            console.log('OK: CURRENT_PROJECT_VERSION=' + process.env.BUILD_NUMBER + ' y MARKETING_VERSION=' + process.env.MARKETING_VERSION + ' aplicados');
          "
          grep -n "CURRENT_PROJECT_VERSION\|MARKETING_VERSION" ${{ env.IOS_PROJECT_PATH }}/${{ env.IOS_PROJECT_NAME }}.xcodeproj/project.pbxproj || true

      - name: Create temporary keychain
        run: |
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Import P12 certificate to keychain
        run: |
          echo "Importing normalized P12 (Distribution)..."
          security import ${{ env.IOS_PROJECT_PATH }}/certs/dist_cert_normalized.p12 \
            -k build.keychain \
            -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          echo "--- Certificados en keychain ---"
          security find-certificate -c "iPhone Distribution" build.keychain 2>&1 | head -5 || echo "(revisar identidad)"
          security find-identity -v -p codesigning build.keychain

      - name: Install Provisioning Profile (App Store)
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ${{ env.IOS_PROJECT_PATH }}/certs/profile-appstore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "--- Perfil instalado (verificacion) ---"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile-appstore.mobileprovision 2>/dev/null | grep -E "<key>(Name|UUID|ExpirationDate)" -A1 || true

      - name: Set keychain as default for codesign
        run: |
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" build.keychain

      - name: Generate export options plist (App Store)
        run: |
          node -e "
            const fs = require('fs');
            const plist = [
              '<?xml version=\"1.0\" encoding=\"UTF-8\"?>',
              '<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">',
              '<plist version=\"1.0\">',
              '<dict>',
              '    <key>method</key>',
              '    <string>app-store</string>',
              '    <key>teamID</key>',
              '    <string>FG4FGTT4Z4</string>',
              '    <key>signingStyle</key>',
              '    <string>manual</string>',
              '    <key>signingCertificate</key>',
              '    <string>iPhone Distribution</string>',
              '    <key>provisioningProfiles</key>',
              '    <dict>',
              '        <key>com.urbantaxi.app</key>',
              '        <string>' + process.env.PROFILE_NAME + '</string>',
              '    </dict>',
              '</dict>',
              '</plist>'
            ].join('\n');
            fs.writeFileSync('export-options-appstore.plist', plist);
            console.log('export-options-appstore.plist generado con perfil: ' + process.env.PROFILE_NAME);
          "
          cat export-options-appstore.plist

      - name: Archive iOS App (Release)
        run: |
          cd ${{ env.IOS_PROJECT_PATH }}
          xcodebuild -workspace ${{ env.IOS_PROJECT_NAME }}.xcworkspace \
            -scheme ${{ env.IOS_PROJECT_NAME }} \
            -configuration Release \
            -archivePath build/${{ env.IOS_PROJECT_NAME }}.xcarchive \
            archive

      - name: Export IPA (App Store)
        run: |
          cd ${{ env.IOS_PROJECT_PATH }}
          xcodebuild -exportArchive \
            -archivePath build/${{ env.IOS_PROJECT_NAME }}.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ../export-options-appstore.plist

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanTaxiSJ-${{ env.BUILD_NUMBER }}.ipa
          path: ${{ env.IOS_PROJECT_PATH }}/build/ipa/*.ipa
          retention-days: 30

      - name: Decode App Store Connect API Key (P8)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "${APP_STORE_CONNECT_API_KEY}" > ~/private_keys/AuthKey_${{ env.ASC_API_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ env.ASC_API_KEY_ID }}.p8
          echo "--- P8 instalado (verificacion: solo primera linea) ---"
          head -1 ~/private_keys/AuthKey_${{ env.ASC_API_KEY_ID }}.p8
          ls -la ~/private_keys/

      - name: Upload to App Store Connect (altool)
        run: |
          set -euo pipefail
          IPA_PATH=$(ls ${{ env.IOS_PROJECT_PATH }}/build/ipa/*.ipa | head -1)
          echo "Subiendo $IPA_PATH a App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey ${{ env.ASC_API_KEY_ID }} \
            --apiIssuer ${{ env.ASC_API_KEY_ISSUER_ID }}

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.MARKETING_VERSION }} (${{ env.BUILD_NUMBER }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheme**: ${{ env.IOS_PROJECT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: Release" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle ID**: ${{ env.BUNDLE_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Team ID**: ${{ env.TEAM_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: iPhone Distribution (App Store)" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: ${{ env.PROFILE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Store Connect**: Build subido automaticamente via altool (API Key ${{ env.ASC_API_KEY_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Next**: Revisar TestFlight/App Store Connect (Activities/All Builds), llenar contenido y enviar para review" >> $GITHUB_STEP_SUMMARY
          echo "- **Next**: Revisar TestFlight/App Store Connect (Activities/All Builds), llenar contenido y enviar para review" >> $GITHUB_STEP_SUMMARY